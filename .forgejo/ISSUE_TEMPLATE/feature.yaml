name: Feature request
about: Ask for a tool, or for something this MCP server does not do yet.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Write in whatever language you can; English is easiest for the maintainer to act on.

        Describe the problem before the solution: a feature is judged by the problem it removes. Do not paste personal details such as a CV, an address or the name of somebody you applied to, and never a token.
  - type: textarea
    id: problem
    attributes:
      label: The problem, and who has it
      description: What gets in the way, for whom, and how often.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other ways to solve it, and what you do today.
  - type: dropdown
    id: scope
    attributes:
      label: Where it belongs
      description: This server only calls Postulo's API. If the API has to provide something first, the core gets an issue of its own.
      options:
        - A tool this server should offer
        - Something the API has to provide first (postulo/postulo)
        - Not sure
    validations:
      required: true
